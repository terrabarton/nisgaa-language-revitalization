  <script>
    document.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();

      const views = Array.from(document.querySelectorAll(".book-view"));
      const previousButton = document.getElementById("previous-button");
      const nextButton = document.getElementById("next-button");
      const restartButton = document.getElementById("restart-button");
      const pageCount = document.getElementById("page-count");
      const progressFill = document.getElementById("progress-fill");
      const announcement = document.getElementById("announcement");
      const spreadWindow = document.getElementById("spread-window");

      let currentIndex = 0;
      let touchStartX = 0;

      function pageName(index) {
        return index === 0 ? "Cover" : "Page " + (index + 1);
      }

      function showView(nextIndex) {
        if (nextIndex < 0 || nextIndex >= views.length || nextIndex === currentIndex) return;

        views[currentIndex].classList.remove("active");
        views[currentIndex].hidden = true;

        currentIndex = nextIndex;

        views[currentIndex].hidden = false;
        views[currentIndex].classList.add("active");

        previousButton.disabled = currentIndex === 0;
        nextButton.disabled = currentIndex === views.length - 1;
        pageCount.textContent = pageName(currentIndex);
        progressFill.style.width = (((currentIndex + 1) / views.length) * 100) + "%";
        announcement.textContent = pageName(currentIndex);
      }

      previousButton.addEventListener("click", () => showView(currentIndex - 1));
      nextButton.addEventListener("click", () => showView(currentIndex + 1));
      restartButton.addEventListener("click", () => showView(0));

      document.addEventListener("keydown", (event) => {
        if (event.key === "ArrowLeft") showView(currentIndex - 1);
        if (event.key === "ArrowRight") showView(currentIndex + 1);
      });

      spreadWindow.addEventListener("touchstart", (event) => {
        touchStartX = event.changedTouches[0].screenX;
      }, { passive: true });

      spreadWindow.addEventListener("touchend", (event) => {
        const distance = event.changedTouches[0].screenX - touchStartX;
        if (Math.abs(distance) < 55) return;
        showView(distance < 0 ? currentIndex + 1 : currentIndex - 1);
      }, { passive: true });

      previousButton.disabled = true;
    });
  </script>
